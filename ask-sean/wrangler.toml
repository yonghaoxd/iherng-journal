name = "ask-sean-api"
main = "worker/index.ts"
# Not a secret; lets `wrangler deploy` run from GitHub Actions with just an API token.
account_id = "8ab6ac3fe728d708b5871b2cd858dd91"
compatibility_date = "2026-10-01"
# Fills process.env from vars and secrets, which lib/deepseek.ts reads.
compatibility_flags = ["nodejs_compat"]

[vars]
# Sites allowed to call the API from the browser, comma-separated.
ALLOWED_ORIGINS = "https://iherng-journal.pages.dev,http://localhost:3000,http://localhost:5173"
# New answers per visitor per Malaysian day (resets at midnight MYT); "0" means no limit.
DAILY_NEW_ANSWERS_PER_IP = "0"
# Site-wide spending cap per Malaysian day; new answers pause once it is reached.
DAILY_BUDGET_USD = "1"

# Secrets, set with `npx wrangler secret put <NAME>` (locally they come from .env):
#   DEEPSEEK_API_KEY  required
#   IP_SALT           optional; salts the hashed IPs used for rate limits

[[d1_databases]]
binding = "DB"
database_name = "ask-sean"
database_id = "591afe2b-7219-4c6c-9d79-7179fd6065e2"
migrations_dir = "migrations"
